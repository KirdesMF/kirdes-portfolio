<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
	<style>
		:root {
			--bg: #fff;
			--fg: #000;
		}
		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #000;
				--fg: #fff;
			}
		}
	</style>
	<rect width="32" height="32" fill="var(--bg)" />
	<rect x="4" y="14" width="6" height="6" fill="var(--fg)" />
	<rect x="12" y="14" width="6" height="6" fill="var(--fg)" />
	<rect x="4" y="22" width="6" height="6" fill="var(--fg)" />
	<rect x="12" y="22" width="6" height="6" fill="var(--fg)" />
</svg>
